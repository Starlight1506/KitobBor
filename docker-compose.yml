version: '3.8'

services:
  db:
    image: postgres:16
    container_name: kitobbor_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: kitobbor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: kitobbor_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: